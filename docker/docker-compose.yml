# Local development stack: spins up Qdrant and (once buildable) the API service.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./volumes/qdrant:/qdrant/storage

